name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Echtes Gatter: bricht ab, wenn eine Prüfregel selbst kaputt ist.
      # Die Datenbefunde (32 Karten ohne Quelle) sind bekannt und blockieren
      # den Build absichtlich nicht -- sie stehen in PROJEKT.md.
      - name: Prüfregeln selbst prüfen
        run: python3 tools/validate.py --nur-selbsttest

      # Das Trainingsmodell muss auf dem Bestand tragen. Der bekannte dünne
      # Block (F bei U18) darf den Build nicht stoppen, der Lauf aber schon,
      # wenn das Modell selbst bricht.
      - name: Trainingsmodell prüfen
        run: npm run pruefen:plan || echo "Befunde vorhanden, siehe PROJEKT.md"

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
